name: Check Upstream & Sync to AUR

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if versions match'
        type: boolean
        default: false

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  check-and-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check upstream release
        id: upstream
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python3 scripts/check-upstream.py $FORCE_FLAG

      - name: Generate .SRCINFO using Arch Linux container
        if: steps.upstream.outputs.updated == 'true'
        run: |
          docker run --rm -v "$PWD":/pkg -w /pkg archlinux:base-devel bash -c '
            useradd -m builder
            chown -R builder .
            su builder -c "makepkg --printsrcinfo" > .SRCINFO
          '

      - name: Commit and push changes to GitHub
        if: steps.upstream.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ steps.upstream.outputs.new_version }}-1"
          git push origin master

      - name: Deploy to AUR
        if: steps.upstream.outputs.updated == 'true' && env.AUR_KEY != ''
        uses: KSXGitHub/github-actions-deploy-aur@v3
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        with:
          pkgname: epic-games-launcher-bin
          pkgbuild: ./PKGBUILD
          commit_username: minpeter
          commit_email: kali2005611@gmail.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
